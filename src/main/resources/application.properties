spring.application.name=opposite-of-boring
server.port=${PORT:8080}

# A .env in the backend or the project root (DATABASE_URL, DATABASE_URL_UNPOOLED) switches to Postgres;
# see DatabaseUrlEnvironmentPostProcessor. Real environment variables win over the file.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Without DATABASE_URL: in-memory H2 speaking PostgreSQL, so the same Flyway migrations run on both.
# Browse it at http://localhost:8080/h2-console (JDBC URL below, user "sa", no password)
spring.datasource.url=jdbc:h2:mem:chaos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.h2.console.enabled=true
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that the entities still match it
spring.jpa.hibernate.ddl-auto=validate

# Every request, SSE stream and the LISTEN loop run on virtual threads.
# @ConcurrencyLimit on the mutations keeps them from queueing up on the connection pool instead.
spring.threads.virtual.enabled=true
chaos.mutation-concurrency=8

# API versions come from the API-Version header; no header means 1
spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1
spring.mvc.apiversion.supported=1,2

# Sign in with GitHub when GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET are set (see GitHubLoginEnvironmentPostProcessor).
# GitHub sends people back to GITHUB_CALLBACK_URL, or to <this server>/api/auth/callback/github.
# Sessions are stored in the database (Flyway V2), so every instance knows who is signed in.
spring.session.jdbc.initialize-schema=never
server.servlet.session.cookie.same-site=lax
# Behind nginx or Vercel: trust X-Forwarded-Proto/Host, so redirects and secure cookies use the public URL
server.forward-headers-strategy=framework

# messages.properties is German (the default); messages_en.properties is English
spring.messages.fallback-to-system-locale=false

# SSE streams stay open indefinitely
spring.mvc.async.request-timeout=-1

management.endpoints.web.exposure.include=health,info,metrics
# Traces, metrics and logs go out over OTLP once an endpoint is configured, e.g.
# MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT:false}

# "local" delivers events in-process; DatabaseUrlEnvironmentPostProcessor switches to "postgres",
# which fans them out to every instance with LISTEN/NOTIFY
chaos.relay.mode=local

# How often hype drifts back toward zero
chaos.decay-interval=4s
# How often a random mutator kicks in on its own, and how long each one lasts
chaos.mutator-interval=90s
chaos.mutator-duration=45s
chaos.seed-demo-data=true
